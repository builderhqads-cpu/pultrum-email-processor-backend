services:
  postgres:
    image: postgres:16-alpine
    container_name: pultrum-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pultrum_mail_processor}
      POSTGRES_USER: ${POSTGRES_USER:-pultrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pultrum}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pultrum-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pultrum-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Document-extraction microservice (PDF/DOCX/XLSX -> structured text).
  # Backend (on the host) reaches it at http://localhost:8000. Heavy first build
  # (docling + torch); models cache in the docling_models volume.
  docling:
    build: ./docling-service
    container_name: pultrum-docling
    restart: unless-stopped
    environment:
      DOCLING_OCR: "${DOCLING_OCR:-false}"
      DOCLING_TABLE_STRUCTURE: "${DOCLING_TABLE_STRUCTURE:-true}"
    ports:
      - "${DOCLING_PORT:-8000}:8000"
    volumes:
      - docling_models:/models

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  docling_models:
